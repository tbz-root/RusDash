name: Build Geode Mod

on:
  workflow_dispatch:
 ## push:
 ##   branches: [main]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          # - name: macOS
          #   os: macos-14

          # - name: iOS
          #   os: macos-14
          #   target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: nightly
          target: ${{ matrix.config.target }}
          use-lto: false
          ccache-variant: default
          use-cpm-cache: true

        env:
          GEODE_TRADE_DIR: ${{ github.workspace }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          optimize-pngs: false
          zstd: false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{steps.build.outputs.build-output}}